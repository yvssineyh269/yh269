# Requis par pnpm 9 (utilisé par Vercel) dès que ce fichier existe
packages:
  - "."

allowBuilds:
  sharp: true
  unrs-resolver: true

# Mêmes valeurs que "pnpm.overrides" dans package.json : pnpm 11+ ne lit que ce fichier,
# alors que le pnpm de Vercel lit package.json. Les deux doivent rester identiques.
overrides:
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
